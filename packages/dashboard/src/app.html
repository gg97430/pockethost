<!doctype html>
<!--suppress ALL -->
<html lang="fr" class="h-full wa-dark wa-theme-default wa-brand-green" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <script>
      ;(() => {
        const storageKey = 'gestion-pocketbase-theme'
        const applyTheme = (theme) => {
          const root = document.documentElement
          const next = theme === 'light' ? 'light' : 'dark'
          root.dataset.theme = next
          root.classList.toggle('wa-dark', next === 'dark')
          root.classList.toggle('wa-light', next === 'light')
          root.style.colorScheme = next
        }

        try {
          const storedTheme = localStorage.getItem(storageKey)
          applyTheme(storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'dark')
        } catch {
          applyTheme('dark')
        }
      })()
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    %sveltekit.head%
  </head>
  <body class="app-body">
    <div>%sveltekit.body%</div>
  </body>
</html>
