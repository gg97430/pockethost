<!doctype html>
<!--suppress ALL -->
<html lang="fr" class="h-full wa-dark wa-theme-default wa-brand-blue" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <script>
      ;(() => {
        const storageKey = 'gestion-pocketbase-theme'
        const applyTheme = (theme) => {
          const root = document.documentElement
          const next = theme === 'light' ? 'light' : 'dark'
          root.dataset.theme = next
          root.classList.toggle('wa-dark', next === 'dark')
          root.classList.toggle('wa-light', next === 'light')
          root.style.colorScheme = next
        }

        try {
          const storedTheme = localStorage.getItem(storageKey)
          applyTheme(storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'dark')
        } catch {
          applyTheme('dark')
        }
      })()
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />    <meta name="viewport" content="width=device-width, initial-scale=1" />

    %sveltekit.head%
  </head>
  <body class="app-body">
    <div>%sveltekit.body%</div>
  </body>
</html>
