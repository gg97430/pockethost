name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm lint

      - name: pockethost types
        run: pnpm --filter pockethost check:types

      - name: phio types
        run: pnpm --filter phio check:types

      - name: dashboard types
        run: pnpm --filter @pockethost/dashboard check:types

      - name: Tests
        run: pnpm test

      - name: Dashboard build
        run: pnpm --filter @pockethost/dashboard build

  mothership-hooks:
    name: Mothership hooks freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify pb_hooks matches TS source
        run: pnpm check:mothership-hooks

  server-provisioning:
    name: Server provisioning regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Shell syntax
        run: |
          bash -n setup.sh
          bash -n packages/pockethost/scripts/install-server-prerequisites.sh
          bash -n packages/pockethost/scripts/setup-web-hosting.sh
          bash -n packages/pockethost/scripts/install-railpack.sh
      - name: Server acceptance and hosting regressions
        run: |
          python3 packages/pockethost/scripts/test-server-readiness.py
          python3 packages/pockethost/scripts/test-web-app-runtime.py
          python3 packages/pockethost/scripts/test-web-app-allocation.py
          python3 packages/pockethost/scripts/test-web-app-railpack.py
          python3 packages/pockethost/scripts/test-web-app-worker.py
      - name: Fresh Ubuntu prerequisites and disposable archive round trip
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/src:ro" ubuntu:24.04 bash -euc '
            bash /src/packages/pockethost/scripts/install-server-prerequisites.sh
            bash /src/packages/pockethost/scripts/install-server-prerequisites.sh
            useradd --create-home kolab-check
            runuser -u kolab-check -- python3 -B /src/packages/pockethost/scripts/check-server-archive.py
          '
